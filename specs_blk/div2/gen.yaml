dut_class: bag3_digital.layout.stdcells.util.STDCellWrapper
impl_lib: AAA_DIV2
impl_cell: AA_div2
root_dir: gen_outputs/div2

params:
  cls_name: bag3_digital.layout.clk_divider.div2.Div2
  draw_taps: True

  params:
    inv_params:
      seg: 2
    dff_params:
      seg: 2
      seg_ck: 2

    pinfo:
      lch: 36
      top_layer: 3
      tr_widths:
        sig: {2: 2, 3: 2}
        sup: {2: 4}
      tr_spaces: {}

      row_specs:
        - mos_type: nch
          width: 2
          threshold: standard
          bot_wires:
            data: ['sup', 'sig<0:1>']
            shared: ['sup']
          top_wires:
            data: ['sig<0:2>']
          flip: True
        - mos_type: pch
          width: 2
          threshold: standard
          bot_wires:
            data: ['sig<0:2>']
          top_wires:
            data: ['sig<0:1>', 'sup']
            shared: ['sup']
