impl_lib: AAA_INV_CHAIN_GR
impl_cell: AA_inv_chain
root_dir: gen_outputs/inv_chain_gr
dut_class: xbase.layout.mos.top.GenericWrapper

params:
  cls_name: bag3_digital.layout.stdcells.inv_chain_gr.InvChainCoreGuardRing
  params:
    draw_taps: BOTH
    seg_list: [2, 8]
    pinfo:
      tiles:
        - name: core_tile
      tile_specs:
        arr_info:
          lch: 36
          top_layer: 4
          tr_widths:
            sup: {2: 2, 3: 2, 4: 2, 5: 2, 6: 4}
            sig: {2: 1, 3: 2, 4: 2, 5: 3, 6: 4}
            guard: {2: 2, 3: 2, 4: 2}
          tr_spaces:
            !!python/tuple ['sup', '']: {2: 0, 3: 0, 4: 1}
            !!python/tuple ['guard', '']: {2: 0, 3: 0, 4: 1}
            !!python/tuple ['sig', '']: {2: 0, 3: 0, 4: 0}
        place_info:
          core_tile:
            priority: 1
            bot_mirror: False
            top_mirror: False
            row_specs:
            - mos_type: nch
              width: 4
              threshold: standard
              bot_wires: ['sup', 'sig<0:1>']
              top_wires: ['sig<0:1>']
              flip: True
              options:
                guard_ring_col: True
            - mos_type: ntap
              width: 5
              threshold: standard
              bot_wires:
                data: ['guard']
                align: CENTER_COMPACT
              top_wires: []
              flip: True
              options:
                guard_ring: True
            - mos_type: ptap
              width: 5
              threshold: standard
              bot_wires: []
              top_wires:
                data: ['guard']
                align: CENTER_COMPACT
              options:
                guard_ring: True
            - mos_type: pch
              width: 4
              threshold: standard
              bot_wires: ['sig<0:1>']
              top_wires: ['sig<0:1>', 'sup']
              options:
                guard_ring_col: True
          ngr:
            priority: 2
            bot_mirror: False
            top_mirror: False
            row_specs:
              - mos_type: ntap
                width: 5
                threshold: lvt
                bot_wires: []
                top_wires:
                  data: ['guard']
                  align: CENTER_COMPACT
                options:
                  guard_ring: True
          pgr:
            priority: 2
            bot_mirror: False
            top_mirror: False
            row_specs:
              - mos_type: ptap
                width: 5
                threshold: lvt
                bot_wires: []
                top_wires:
                  data: ['guard']
                  align: CENTER_COMPACT
                options:
                  guard_ring: True
        abut_list:
          - [[ngr, 1], [core_tile, 0]]
          - [[core_tile, 1], [pgr, 1]]
