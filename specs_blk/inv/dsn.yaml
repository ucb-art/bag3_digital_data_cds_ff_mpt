dsn_class: bag3_digital.design.stdcells.inv.beta.InverterBetaDesigner
root_dir: gen_outputs/inv/dsn
impl_lib: AAA_DSN_INV

dsn_params:

  gen_specs: data/bag3_digital/specs_blk/inv/gen_sch.yaml
  seg_n: 8

  meas_params:
    sim_envs: [tt_25, ss_m40, ff_125]
    tbm_specs:
      sim_params:
        t_rst: 0.0
        t_rst_rf: 0.0
        t_per: 300.0e-12
        t_rf: 5.0e-12
        c_load: 20.0e-15
      pwr_domain:
        in: [VSS, VDD]
        out: [VSS, VDD]
      sup_values:
        VDD: {tt_25: 0.8, ss_m40: 0.72, ff_125: 0.88}
        VSS: 0.0
      swp_info:
      - ['c_load', {type: LINEAR, start: 5e-15, stop: 15e-15, num: 3}]
